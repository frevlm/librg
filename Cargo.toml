# ripgrep 14.1.1 as a static library with a C interface (include/rg.h).
# ripgrep/ is the release's crates/core, vendored with three patches marked
# `librg:`; its crates come from crates.io at the versions 14.1.1 releases them
# with, and Cargo.lock starts from 14.1.1's.
[package]
name = "rg"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.75"
bstr = "1.7.0"
lexopt = "0.3.0"
log = "0.4.5"
serde_json = "1.0.23"
termcolor = "1.1.0"
textwrap = { version = "0.16.0", default-features = false }
grep = "=0.3.2"
grep-cli = "=0.1.11"
grep-matcher = "=0.1.7"
grep-printer = "=0.2.2"
grep-regex = "=0.1.13"
grep-searcher = "=0.1.14"
globset = "=0.4.15"
ignore = "=0.4.23"

[features]
pcre2 = ["grep/pcre2"]
